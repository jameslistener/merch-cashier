<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Касса">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css">
  <title>Касса Мерч</title>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1 id="page-title">Каталог</h1>
      <nav id="tab-bar">
        <button class="tab active" data-tab="catalog" onclick="switchTab('catalog')">
          <span class="tab-icon">🏪</span>
          <span class="tab-label">Каталог</span>
        </button>
        <button class="tab" data-tab="cart" onclick="switchTab('cart')">
          <span class="tab-icon">🛒</span>
          <span class="tab-label">Корзина</span>
        </button>
        <button class="tab" data-tab="stock" onclick="switchTab('stock')">
          <span class="tab-icon">📦</span>
          <span class="tab-label">Склад</span>
        </button>
        <button class="tab" data-tab="logs" onclick="switchTab('logs')">
          <span class="tab-icon">📋</span>
          <span class="tab-label">Логи</span>
        </button>
        <button class="tab" data-tab="stats" onclick="switchTab('stats')">
          <span class="tab-icon">📊</span>
          <span class="tab-label">Стат.</span>
        </button>
      </nav>
    </header>

    <!-- Pages -->
    <main id="main">
      <!-- Catalog Page -->
      <section id="page-catalog" class="page active">
        <div id="categories" class="categories-bar"></div>
        <div class="catalog-layout">
          <div id="products-grid" class="products-grid"></div>
          <aside id="mini-cart" class="mini-cart">
            <div class="mini-cart-header">🛒 Корзина</div>
            <div id="mini-cart-items" class="mini-cart-items"></div>
            <div id="mini-cart-total" class="mini-cart-total"></div>
          </aside>
        </div>
      </section>

      <!-- Cart Page -->
      <section id="page-cart" class="page">
        <div id="cart-total" class="cart-total"></div>
        <div class="cart-actions">
          <button id="btn-sell" class="btn btn-primary btn-large" onclick="confirmSale()">💰 Продать</button>
          <button id="btn-clear-cart" class="btn btn-danger btn-large" onclick="confirmClearCart()">Очистить</button>
        </div>
        <div id="cart-promos" class="cart-promos"></div>
        <div id="cart-items" class="cart-items"></div>
      </section>

      <!-- Logs Page -->
      <section id="page-logs" class="page">
        <div class="logs-header">
          <div class="logs-filters">
            <button class="filter-btn active" data-filter="all" onclick="filterLogs('all')">Все</button>
            <button class="filter-btn" data-filter="sale" onclick="filterLogs('sale')">Продажи</button>
            <button class="filter-btn" data-filter="return" onclick="filterLogs('return')">Возвраты</button>
            <button class="filter-btn" data-filter="stock" onclick="filterLogs('stock')">Склад</button>
          </div>
          <button class="btn btn-danger" onclick="confirmClearLogs()">🗑️ Очистить логи</button>
        </div>
        <div id="logs-list" class="logs-list"></div>
      </section>

      <!-- Stats Page -->
      <section id="page-stats" class="page">
        <div id="stats-content" class="stats-content"></div>
      </section>

      <!-- Stock Page -->
      <section id="page-stock" class="page">
        <div id="stock-categories" class="categories-bar"></div>
        <div id="stock-list" class="stock-list"></div>
        <div class="stock-footer">
          <button class="btn btn-danger btn-large" onclick="confirmClearStock()">🗑️ Очистить склад</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

<script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
